<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Bot Dashboard</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login hidden">
    <form class="login-card" id="login-form">
        <div class="brand brand-lg"><span class="brand-icon" data-icon="bot"></span><span>Bot Dashboard</span></div>
        <p class="muted">Melde dich an, um deine Bots zu verwalten.</p>
        <label class="field">
            <span>Passwort</span>
            <input type="password" id="login-password" autocomplete="current-password" required autofocus>
        </label>
        <p class="form-error" id="login-error"></p>
        <button class="btn btn-primary btn-block" type="submit"><span data-icon="login"></span>Anmelden</button>
    </form>
</div>

<div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
            <a class="brand" href="#/"><span class="brand-icon" data-icon="bot"></span><span>Bot Dashboard</span></a>
            <button class="icon-btn only-mobile" id="close-sidebar" aria-label="Menü schließen"><span data-icon="x"></span></button>
        </div>
        <nav class="nav">
            <a href="#/" class="nav-link" data-route="overview"><span data-icon="grid"></span>Übersicht</a>
        </nav>
        <div class="nav-section">
            <span>Bots</span>
            <button class="icon-btn icon-btn-sm" data-action="new-bot" aria-label="Neuer Bot"><span data-icon="plus"></span></button>
        </div>
        <nav class="nav nav-bots" id="nav-bots"></nav>
        <div class="sidebar-foot">
            <button class="nav-link" id="logout"><span data-icon="logout"></span>Abmelden</button>
        </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <div class="main">
        <header class="topbar">
            <button class="icon-btn only-mobile" id="open-sidebar" aria-label="Menü öffnen"><span data-icon="menu"></span></button>
            <div class="topbar-title" id="topbar-title">Übersicht</div>
            <div class="topbar-actions">
                <span class="conn" id="conn" title="Live-Verbindung"><span class="dot"></span><span class="conn-label">Live</span></span>
                <button class="btn btn-primary" data-action="new-bot"><span data-icon="plus"></span><span class="hide-sm">Neuer Bot</span></button>
            </div>
        </header>
        <main class="content" id="view"></main>
    </div>
</div>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card"></div>
</div>
<div class="toasts" id="toasts"></div>

<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
